name: StockWise CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Run Jest tests
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # Smoke test after deploy (AARON: CI/CD Upgrade)
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Health check smoke test
        run: |
          echo "Waiting for deploy..."
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.DEPLOY_URL }}/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — /api/health returned $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED ✓"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, smoke-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "Add your deploy command here (Render/Railway/Fly.io/Vercel)"
        # Example for Render:
        # run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
