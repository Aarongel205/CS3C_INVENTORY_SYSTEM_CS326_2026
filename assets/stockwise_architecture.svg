<svg width="680" height="860" viewBox="0 0 680 860" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <title>StockWise System Architecture</title>
  <rect width="680" height="860" fill="#ffffff"/>

  <!-- ── CLIENT LAYER ── -->
  <rect x="40" y="20" width="600" height="210" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="46" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#888" letter-spacing="1">CLIENT LAYER</text>
  <text x="64" y="72" dominant-baseline="central" font-size="12" fill="#666">Browser (Chrome / Firefox / Mobile)</text>
  <rect x="64" y="88" width="552" height="126" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="112" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">index.html + style.css + app.js</text>
  <text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Single Page App (SPA)</text>
  <text x="84" y="158" dominant-baseline="central" font-size="12" fill="#534AB7">— Dashboard, Inventory, Reports, Logs</text>
  <text x="84" y="178" dominant-baseline="central" font-size="12" fill="#534AB7">— LocalStorage fallback when offline</text>

  <!-- ── CONNECTOR 1 ── -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="340" y1="230" x2="340" y2="285" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="260" dominant-baseline="central" font-size="12" fill="#888">HTTP / REST</text>

  <!-- ── SERVER LAYER ── -->
  <rect x="40" y="288" width="600" height="240" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="314" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#888" letter-spacing="1">SERVER LAYER</text>
  <text x="64" y="338" dominant-baseline="central" font-size="12" fill="#666">Node.js + Express (Render.com)</text>
  <rect x="64" y="354" width="552" height="158" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#042C53">server.js</text>
  <text x="84" y="402" dominant-baseline="central" font-size="12" fill="#0C447C">— Serves static frontend files</text>
  <text x="84" y="422" dominant-baseline="central" font-size="12" fill="#0C447C">— REST API: /api/items, /api/logs</text>
  <text x="84" y="442" dominant-baseline="central" font-size="12" fill="#0C447C">— Input validation</text>
  <text x="84" y="462" dominant-baseline="central" font-size="12" fill="#0C447C">— Rate limiting (200 req / 15 min)  ·  Helmet security headers  ·  Morgan request logging</text>

  <!-- ── CONNECTOR 2 ── -->
  <line x1="340" y1="528" x2="340" y2="583" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="356" y="558" dominant-baseline="central" font-size="12" fill="#888">HTTPS / Supabase REST API</text>

  <!-- ── DATABASE LAYER ── -->
  <rect x="40" y="586" width="600" height="254" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="612" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="500" fill="#888" letter-spacing="1">DATABASE LAYER</text>
  <text x="64" y="636" dominant-baseline="central" font-size="12" fill="#666">Supabase (PostgreSQL — Singapore region)</text>

  <!-- items table -->
  <rect x="64" y="652" width="256" height="162" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="192" y="676" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">items table</text>
  <text x="84" y="702" dominant-baseline="central" font-size="12" fill="#085041">id (UUID)</text>
  <text x="84" y="722" dominant-baseline="central" font-size="12" fill="#085041">name</text>
  <text x="84" y="742" dominant-baseline="central" font-size="12" fill="#085041">sku</text>
  <text x="84" y="762" dominant-baseline="central" font-size="12" fill="#085041">category · quantity · price</text>
  <text x="84" y="782" dominant-baseline="central" font-size="12" fill="#085041">…and more</text>

  <!-- activity_logs table -->
  <rect x="360" y="652" width="256" height="162" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="488" y="676" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">activity_logs table</text>
  <text x="380" y="702" dominant-baseline="central" font-size="12" fill="#085041">id (UUID)</text>
  <text x="380" y="722" dominant-baseline="central" font-size="12" fill="#085041">action</text>
  <text x="380" y="742" dominant-baseline="central" font-size="12" fill="#085041">item_name</text>
  <text x="380" y="762" dominant-baseline="central" font-size="12" fill="#085041">detail</text>
  <text x="380" y="782" dominant-baseline="central" font-size="12" fill="#085041">created_at</text>

  <!-- RLS badge -->
  <rect x="214" y="826" width="252" height="28" rx="6" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="840" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">Row Level Security (RLS) enabled</text>
</svg>
